server:
  port: ${PORT:8085}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: todo-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/todoapp}
    username: ${DATABASE_USERNAME:todoapp}
    password: ${DATABASE_PASSWORD:todoapp}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
  security:
    jwt-secret: ${JWT_SECRET:development-only-secret-change-before-production-2026-very-long-key}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}

logging:
  level:
    com.todoapp: INFO
    org.springframework.security: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
