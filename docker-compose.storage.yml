# Optional S3-compatible staging storage. Run with:
# docker compose -f docker-compose.yml -f docker-compose.storage.yml up --build
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-focusflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-focusflow-local-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-focusflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-focusflow-local-password}
      S3_BUCKET: ${S3_BUCKET:-focusflow-attachments}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$S3_BUCKET"

  backend:
    environment:
      STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:-focusflow-attachments}
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-focusflow-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-focusflow-local-password}
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
